<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="errors.js"></script>
  <script src="announce.js" data-aud="student" defer></script>
  <link rel="icon" type="image/png" href="icon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PolyABC - Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px 24px; }
    .logo { height: 70px; margin-bottom: 8px; }
    .welcome-title { font-size: 1.3rem; font-weight: 900; color: white; text-align: center; margin-bottom: 12px; }
    .card { background: #16213e; border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
    .greeting-btn { padding: 14px; border-radius: 12px; border: none; font-family: Nunito, sans-serif; font-size: 1rem; font-weight: 900; cursor: pointer; transition: transform 0.15s, background 0.2s, opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .greeting-btn:hover:not(:disabled) { transform: scale(1.02); }
    .btn-enter { background: #1a73e8; color: white; }
    .btn-enter:disabled { background: #334; color: #667; cursor: not-allowed; opacity: 0.5; }
    .btn-enter:not(:disabled):hover { background: #1558b0; }
    .btn-speed { background: #00897b; color: white; }
    .btn-speed:hover { background: #00695c; }
    .btn-schedule { background: #0f3460; color: #a0c4ff; border: 2px solid #1a73e8; }
    .btn-schedule:hover { background: #1a3a6e; }
    .btn-exit { background: transparent; color: #667; border: 2px solid #334; }
    .btn-exit:hover { border-color: #e53935; color: #e53935; }

    /* Network test modal */
    #net-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; flex-shrink: 0; }
    #net-box { background: #16213e; border-radius: 24px; padding: 28px 24px; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    #net-title { font-size: 1rem; font-weight: 900; color: #a0c4ff; margin-bottom: 20px; }
    #net-verdict { display: none; font-size: 2.5rem; margin-bottom: 6px; }
    #net-verdict-label { display: none; font-size: 1rem; font-weight: 900; margin-bottom: 20px; }
    .net-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .net-card { background: #0f3460; border-radius: 12px; padding: 12px 6px; }
    .net-val { font-size: 1.4rem; font-weight: 900; color: white; }
    .net-unit { font-size: 0.65rem; color: #a0c4ff; font-weight: 700; margin-top: 2px; }
    .net-lbl { font-size: 0.7rem; color: #667; margin-top: 3px; }
    #net-enter-btn { display: none; width: 100%; padding: 14px; border-radius: 12px; border: none; background: #1a73e8; color: white; font-family: Nunito; font-size: 1rem; font-weight: 900; cursor: pointer; margin-bottom: 10px; }
    #net-enter-btn:hover { background: #1558b0; }
    .net-close-btn { width: 100%; padding: 10px; border-radius: 12px; border: none; background: #0f3460; color: #a0c4ff; font-family: Nunito; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    #apple-warn { display: none; margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; background: #fff3cd; color: #5c4300; border: 2px solid #f0b400; font-weight: 800; font-size: 0.95rem; line-height: 1.45; text-align: left; }
    #nudge-bar { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; padding: 14px 12px; text-align: center; color: white; font-weight: 900; font-size: 1.05rem; line-height: 1.5; animation: nudgeflash 0.9s infinite; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
    @keyframes nudgeflash { 0%, 100% { background: #e53935; } 50% { background: #7f0000; } }
  </style>
</head>
<body>

<div id="nudge-bar"></div>

<a href="login.html"><img src="LOGO.png" class="logo" alt="PolyABC" style="cursor:pointer;"/></a>
<div class="welcome-title">Welcome, <span id="student-name">Student</span>! 👋</div>

<div class="card">
  <div id="apple-warn">⚠️ Tu dispositivo no es compatible. Puede funcionar lento o no funcionar. Por favor, cambia a otro dispositivo.</div>
  <button class="greeting-btn btn-enter" id="enter-btn" onclick="enterClass()" disabled>🎓 Enter Class</button>
  <button class="greeting-btn btn-speed" id="speed-btn" onclick="openNetTest()">📶 Run Speed Test</button>
  <button class="greeting-btn btn-schedule" id="hw-btn" onclick="window.location.href='student.html#homework'">📚 My Homework</button>
  <button class="greeting-btn btn-schedule" onclick="window.location.href='student.html'">🎓 Student Panel</button>
  <button class="greeting-btn btn-schedule" onclick="window.location.href='check.html'">🔧 Test my camera &amp; mic</button>
  <button class="greeting-btn btn-exit" onclick="exitToLogin()">🚪 Exit</button>
</div>

<!-- Network Test Modal -->
<div id="net-modal">
  <div id="net-box">
    <div id="net-title">📡 Ready to test your connection</div>
    <div id="net-verdict"></div>
    <div id="net-verdict-label"></div>
    <div class="net-grid">
      <div class="net-card"><div class="net-val" id="m-ping">—</div><div class="net-unit">ms</div><div class="net-lbl">Ping</div></div>
      <div class="net-card"><div class="net-val" id="m-jitter">—</div><div class="net-unit">ms</div><div class="net-lbl">Jitter</div></div>
      <div class="net-card"><div class="net-val" id="m-loss">—</div><div class="net-unit">%</div><div class="net-lbl">Packet Loss</div></div>
    </div>
    <button id="net-enter-btn" onclick="proceedToClass()">🎓 Enter Class</button>
    <button class="net-close-btn" onclick="document.getElementById('net-modal').style.display='none'">Close</button>
  </div>
</div>

<script>
  const SERVER_URL = "https://polyabc-server.onrender.com";

  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
    document.addEventListener('click', () => {
      if (!document.fullscreenElement) try { const el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen; if (fs) { const r = fs.call(el); if (r && r.catch) r.catch(() => {}); } } catch (e) {}
    }, { once: true });
  }

  // Apple phones/tablets freeze the page in the background and cut sound: warn (does not block)
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    document.getElementById('apple-warn').style.display = 'block';
  }

  const token = localStorage.getItem('studentToken');
  const room  = localStorage.getItem('studentRoom');
  const name  = localStorage.getItem('studentName');
  if (!token || !room) window.location.href = 'login.html';
  document.getElementById('student-name').textContent = name || 'Student';

  let _sessionId = null;
  let _sessionTime = null;
  let _netResult = null;

  function nowGDLMins() {
    const s = new Date().toLocaleString('en-US', { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', hour12: false });
    const [h, m] = s.split(':').map(Number);
    return h * 60 + m;
  }

  async function getActiveSessionId() {
    try {
      const res = await fetch(`${SERVER_URL}/assignments?room=${room}`, { headers: { Authorization: `Bearer ${token}` } });
      const assignments = await res.json();
      if (!assignments.length) return null;
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
      const todayA = assignments.filter(a => a.date === today);
      if (!todayA.length) return null;
      const nowMins = nowGDLMins();
      let best = null, bestDiff = Infinity;
      // prefer a class that has not ended yet (back-to-back classes), else the closest one
      const durOf = a => (a.classType === 'Trial' ? 15 : (parseInt((String(a.classType||'').match(/(\d+)\s*min/i)||[])[1],10) || 30));
      const notEnded = todayA.filter(a => { const [h, m] = a.time.split(':').map(Number); return nowMins < h * 60 + m + durOf(a); });
      for (const a of (notEnded.length ? notEnded : todayA)) {
        const [hh, mm] = a.time.split(':').map(Number);
        const diff = Math.abs(nowMins - (hh * 60 + mm));
        if (diff < bestDiff && diff <= 90) { bestDiff = diff; best = a; }
      }
      _sessionTime = best?.time || null;
      return best?.sessionId || null;
    } catch(e) { return null; }
  }

  // How many homeworks are still to do (shown on the button)
  async function loadHomeworkCount() {
    try {
      const r = await fetch(`${SERVER_URL}/student/homework`, { headers: { Authorization: `Bearer ${token}` } });
      const list = await r.json();
      const n = Array.isArray(list) ? list.filter(h => h.status === 'assigned' && !h.closed).length : 0;
      const b = document.getElementById('hw-btn');
      if (b && n) b.textContent = `📚 My Homework (${n} to do)`;
    } catch (e) {}
  }
  loadHomeworkCount();

  async function init() {
    _sessionId = await getActiveSessionId();
    postLobby('lobby-opened');
    const cached = _sessionId && localStorage.getItem(`nettest_${_sessionId}`);
    if (cached) { _netResult = JSON.parse(cached); unlockEnterBtn(_netResult); }
    else if (_sessionId && _sessionTime && inClassWindow()) { _autoTest = true; openNetTest(); }   // run the speed test by itself, like the teacher page
  }
  // From 30 min before the class until it ends
  function inClassWindow() {
    const [hh, mm] = _sessionTime.split(':').map(Number), st = hh * 60 + mm, n = nowGDLMins();
    return n >= st - 30 && n < st + 60;
  }
  let _autoTest = false;
  init();

  function unlockEnterBtn(result) {
    document.getElementById('enter-btn').disabled = false;
    const emoji = result.quality === 'good' ? '🟢' : result.quality === 'fair' ? '🟡' : '🔴';
    const btn = document.getElementById('speed-btn');
    btn.textContent = `${emoji} ${result.avgPing}ms ping · ${result.jitter}ms jitter · ${result.packetLoss}% loss`;
    btn.style.background = result.quality === 'good' ? '#1b5e20' : result.quality === 'fair' ? '#f57f17' : '#b71c1c';
    btn.onclick = openNetTest;
  }

  function openNetTest() {
    document.getElementById('net-modal').style.display = 'flex';
    runNetTest();
  }


  // Real speed (Cloudflare's test endpoints): a short download and upload; null if the network blocks it
  async function measureSpeed() {
    const out = { down: null, up: null };
    try {
      const c = new AbortController(), to = setTimeout(() => c.abort(), 10000), t0 = performance.now();
      const r = await fetch('https://speed.cloudflare.com/__down?bytes=2000000&_=' + Date.now(), { cache: 'no-store', signal: c.signal });
      const b = await r.arrayBuffer(); clearTimeout(to);
      out.down = +(b.byteLength * 8 / ((performance.now() - t0) / 1000) / 1e6).toFixed(1);
    } catch (e) { if (e && e.name === 'AbortError') out.down = 1; }   // did not finish in 10 s = under ~1.6 Mbps
    try {
      const c = new AbortController(), to = setTimeout(() => c.abort(), 10000), t0 = performance.now();
      await fetch('https://speed.cloudflare.com/__up', { method: 'POST', body: new Uint8Array(1000000), cache: 'no-store', signal: c.signal });
      clearTimeout(to);
      out.up = +(1000000 * 8 / ((performance.now() - t0) / 1000) / 1e6).toFixed(1);
    } catch (e) { if (e && e.name === 'AbortError') out.up = 0.5; }   // did not finish in 10 s = under ~0.8 Mbps
    return out;
  }

  async function runNetTest() {
    document.getElementById('net-title').textContent = '📡 Testing your connection...';
    document.getElementById('net-verdict').style.display = 'none';
    document.getElementById('net-verdict-label').style.display = 'none';
    document.getElementById('net-enter-btn').style.display = 'none';
    ['m-ping','m-jitter','m-loss'].forEach(id => document.getElementById(id).textContent = '—');

    const times = []; let failed = 0; const total = 80;
    for (let i = 0; i < total; i++) {
      try {
        const s = performance.now();
        await fetch(`https://1.1.1.1/cdn-cgi/trace?_=${Date.now()}_${i}`, { cache: 'no-store', mode: 'no-cors' });
        times.push(performance.now() - s);
      } catch(e) { failed++; }
      if (times.length && i % 10 === 9) {
        document.getElementById('m-ping').textContent = Math.round(times.reduce((a,b)=>a+b,0)/times.length);
        document.getElementById('net-title').textContent = `📡 Testing... ${Math.round((i+1)/total*100)}%`;
      }
    }

    const avgPing    = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : 9999;
    const mean = avgPing; const jitter = times.length > 1 ? Math.round(Math.sqrt(times.reduce((s,t)=>s+(t-mean)**2,0)/times.length)) : 0;
    const packetLoss = Math.round((failed / total) * 100);

    document.getElementById('m-ping').textContent   = avgPing >= 9999 ? '∞' : avgPing;
    document.getElementById('m-jitter').textContent = jitter;
    document.getElementById('m-loss').textContent   = packetLoss;

    document.getElementById('net-title').textContent = '📡 Midiendo velocidad…';
    const sp = await measureSpeed();
    let quality, emoji, label, color;
    if (avgPing < 150 && jitter < 80 && packetLoss === 0) {
      quality = 'good'; emoji = '🟢'; label = 'Great Connection'; color = '#00c853';
    } else if (avgPing < 300 && jitter < 200 && packetLoss <= 10) {
      quality = 'fair'; emoji = '🟡'; label = 'Fair Connection — You may experience minor audio or video issues during class.'; color = '#ffd740';
    } else {
      quality = 'poor'; emoji = '🔴'; label = 'Poor Connection — You may experience significant issues during class. Please check your internet.'; color = '#e53935';
    }

    // slow = poor signal, or too little speed for video (upload matters most)
    const slow = quality === 'poor' || (sp.up != null && sp.up < 0.8) || (sp.down != null && sp.down < 2);
    if (slow) {
      emoji = '🟠'; color = '#ff9100'; quality = quality === 'poor' ? 'poor' : 'fair';
      label = '⚠️ Tu conexión es lenta. Por favor revisa tu internet. Tu clase empezará en modo de bajo consumo (video más pequeño para que no se trabe).';
    }
    const spLine = document.getElementById('net-speed-line') || (() => { const d = document.createElement('div'); d.id = 'net-speed-line'; d.style.cssText = 'font-weight:800;font-size:0.9rem;color:#cfd8dc;margin:0 0 14px;'; document.getElementById('net-verdict-label').after(d); return d; })();
    spLine.textContent = (sp.down != null || sp.up != null) ? `⬇ ${sp.down != null ? sp.down : '?'} Mbps · ⬆ ${sp.up != null ? sp.up : '?'} Mbps` : '';
    document.getElementById('net-verdict').textContent = emoji;
    document.getElementById('net-verdict').style.display = 'block';
    const lbl = document.getElementById('net-verdict-label');
    lbl.textContent = label; lbl.style.color = color;
    lbl.style.fontSize = quality === 'good' ? '1.1rem' : '0.88rem';
    lbl.style.display = 'block';
    document.getElementById('net-title').textContent = '✅ Test complete';
    document.getElementById('net-enter-btn').style.display = 'block';

    // Second test: can this network reach the relay server? (the road video takes on strict networks)
    document.getElementById('net-title').textContent = '📡 Checking video route...';
    const relayOk = await testRelay();
    const result = { avgPing, jitter, packetLoss, quality, relayOk, downMbps: sp.down, upMbps: sp.up, slow, testedAt: new Date().toISOString() };
    if (!relayOk) {
      postLobby('relay-failed');
      lbl.textContent = '⚠️ Your network may block video in class. Please try another Wi-Fi or use your phone data, or tell your teacher / Tu red podría bloquear el video. Prueba otro Wi-Fi o datos del celular, o avisa a tu maestra.';
      lbl.style.color = '#ff8a65'; lbl.style.fontSize = '.9rem'; lbl.style.display = 'block';
      document.getElementById('net-verdict').textContent = '⚠️';
    } else postLobby('relay-ok');
    document.getElementById('net-title').textContent = '✅ Test complete';
    _netResult = result;
    if (_sessionId) {
      localStorage.setItem(`nettest_${_sessionId}`, JSON.stringify(result));
      fetch(`${SERVER_URL}/attendance/network-test/student`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ sessionId: _sessionId, networkTest: result, studentName: name })
      }).catch(() => {});
    }
    unlockEnterBtn(result);
  }

  // True if the relay (TURN) server can be reached from this network. Fails open if we can't get the server list.
  async function testRelay() {
    try {
      const r = await fetch(`${SERVER_URL}/ice-servers`).then(x => x.json());
      let servers = r && r.iceServers; if (servers && !Array.isArray(servers)) servers = [servers];
      if (!servers || !servers.length) return true;
      return await new Promise(resolve => {
        let done = false;
        const pc = new RTCPeerConnection({ iceServers: servers, iceTransportPolicy: 'relay' });
        const fin = ok => { if (done) return; done = true; try { pc.close(); } catch (e) {} resolve(ok); };
        pc.onicecandidate = e => { if (e.candidate && /typ relay/.test(e.candidate.candidate)) fin(true); };
        setTimeout(() => fin(false), 7000);
        pc.createDataChannel('t');
        pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => fin(true));
      });
    } catch (e) { return true; }
  }

  // If the class is open, go in by themselves: right after the speed test, or after 60 s even if the test hangs or the button fails.
  let _entering = false; const _pageAt = Date.now();
  function autoForward() {
    if (_entering || !_classOpen) return;
    let denied = false; try { denied = sessionStorage.getItem('noAutoEnter') === '1'; } catch (e) {}
    if (denied) return;
    const testDone = !!_netResult, waited = Date.now() - _pageAt > 90000;
    if (!testDone && !waited) return;
    _entering = true;
    const bar = document.getElementById('nudge-bar');
    bar.style.display = 'block'; bar.innerHTML = '🚀 Entrando a tu clase… / Entering your class…';
    setTimeout(proceedToClass, 1200);
  }
  setInterval(autoForward, 1500);

  function proceedToClass() {
    postLobby('enter-clicked');
    window.location.href = _sessionId ? `classroom.html?room=${room}&sessionId=${_sessionId}` : `classroom.html?room=${room}`;
  }

  function enterClass() { proceedToClass(); }

  // Tech Support can send a stuck student here with ?enter=1: as soon as the page is ready, go straight into class
  if (/[?&]enter=1\b/.test(location.search)) {
    const _t = setInterval(() => { const b = document.getElementById('enter-btn'); if (b && !b.disabled) { clearInterval(_t); proceedToClass(); } }, 400);
    setTimeout(() => clearInterval(_t), 45000);
  }

  // Tell the server what the student does in the lobby (best effort, never blocks anything)
  function postLobby(event) {
    if (!_sessionId) return;
    try {
      fetch(`${SERVER_URL}/student/lobby-event`, { method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ sessionId: _sessionId, event }) }).catch(() => {});
    } catch (e) {}
  }

  // ── "Your class is open" nudge ──
  // Once the class has started AND the teacher has opened it, a student still sitting on this
  // page gets an unmissable flashing banner. After 5 minutes their parent is actually emailed
  // (the server checks the class is open and the student still isn't in it), so the on-screen
  // warning is never an empty threat.
  const NUDGE_WARN_SECS = 300;
  let _classOpen = false, _nudgeSince = null, _warned = false;
  async function pollClassOpen() {
    if (!_sessionId || !_sessionTime) return;
    const [hh, mm] = _sessionTime.split(':').map(Number);
    if (nowGDLMins() < hh * 60 + mm) { _classOpen = false; return; }   // not started yet - nothing to nag about
    try {
      const r = await fetch(`${SERVER_URL}/class-open`, { headers: { Authorization: `Bearer ${token}` } });
      _classOpen = (await r.json()).open === true;
    } catch (e) {}
  }
  function renderNudge() {
    const bar = document.getElementById('nudge-bar');
    if (!_classOpen) { bar.style.display = 'none'; _nudgeSince = null; return; }
    if (!_nudgeSince) _nudgeSince = Date.now();
    const elapsed = Math.floor((Date.now() - _nudgeSince) / 1000);
    bar.style.display = 'block';
    if (elapsed >= NUDGE_WARN_SECS) {
      bar.innerHTML = '📞 Contactando a tus padres...<br><small>Contacting your parents...</small>';
      if (!_warned) {
        _warned = true;
        fetch(`${SERVER_URL}/student/lobby-warning`, { method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ sessionId: _sessionId }) }).catch(() => {});
      }
      return;
    }
    const left = NUDGE_WARN_SECS - elapsed;
    const clock = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    const todo = document.getElementById('enter-btn').disabled
      ? 'Corre la prueba de velocidad y luego entra / Run the speed test, then enter'
      : 'Presiona "Enter Class" ahora / Press "Enter Class" now';
    bar.innerHTML = `🔴 ¡TU CLASE YA ESTÁ ABIERTA! / YOUR CLASS IS OPEN!<br><span style="font-size:0.9rem;">${todo}</span><br><small>Contactaremos a tus padres en ${clock} / We will contact your parents in ${clock}</small>`;
  }
  setInterval(pollClassOpen, 5000);
  setInterval(renderNudge, 1000);
  function exitToLogin() {
    ['studentToken','studentName','studentRoom'].forEach(k => localStorage.removeItem(k));
    window.location.href = 'login.html';
  }
</script>
<script src="live.js" defer></script>
</body>
</html>
