<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyABC · Tech Support</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f6fb; --card:#ffffff; --ink:#1a1a2e; --muted:#6b7280; --line:#e2e6ef; --purple:#6a1b9a; --blue:#1a73e8; --red:#e53935; --green:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121826; --card:#1c2538; --ink:#eef2ff; --muted:#9aa4b8; --line:#2c3850; } }
  :root[data-theme="dark"] { --bg:#121826; --card:#1c2538; --ink:#eef2ff; --muted:#9aa4b8; --line:#2c3850; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif; min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0; }
  h1 { font-size:1.3rem; margin:0; font-weight:900; }
  button { font-family:inherit; cursor:pointer; border-radius:10px; border:none; font-weight:800; padding:9px 14px; font-size:.9rem; }
  .btn-primary { background:var(--purple); color:#fff; }
  .btn-blue { background:var(--blue); color:#fff; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-ghost { background:transparent; color:var(--ink); border:2px solid var(--line); }
  input[type=password], input[type=text] { font-family:inherit; font-size:1rem; padding:10px; border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); width:100%; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .login { max-width:360px; margin:12vh auto 0; }
  .err { color:var(--red); font-weight:700; min-height:1.2em; margin-top:8px; font-size:.9rem; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { flex:1; background:var(--card); border:2px solid var(--line); color:var(--ink); }
  .tab.on { border-color:var(--purple); color:var(--purple); }
  .badge { display:inline-block; background:var(--red); color:#fff; border-radius:10px; padding:1px 7px; font-size:.72rem; margin-left:6px; }
  .muted { color:var(--muted); font-size:.85rem; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .open { border-left:5px solid var(--red); }
  .done { border-left:5px solid var(--green); opacity:.85; }
  .hidden { display:none !important; }
  @media (max-width:480px) { .wrap { padding:12px; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view" class="login hidden">
  <div class="card">
    <h1 style="margin-bottom:6px;">🛠 Tech Support</h1>
    <div class="muted" style="margin-bottom:12px;">Enter the tech support password.</div>
    <input id="tech-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" class="btn-primary" style="width:100%;margin-top:10px;">Log in</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app-view" class="wrap hidden">
  <header>
    <h1>🛠 Tech Support</h1>
    <button class="btn-ghost" id="logout-btn">Log out</button>
  </header>

  <div class="tabs">
    <button class="tab on" id="tab-classes" data-tab="classes">Classes now</button>
    <button class="tab" id="tab-tickets" data-tab="tickets">Tickets <span id="tk-badge" class="badge hidden"></span></button>
    <button class="tab" id="tab-videos" data-tab="videos">Help videos</button>
  </div>

  <!-- Classes -->
  <section id="sec-classes">
    <div class="row" style="margin-bottom:10px;">
      <span class="muted">Classes open right now. Pick one to watch.</span>
      <button class="btn-ghost" id="rooms-refresh">Refresh</button>
    </div>
    <div id="rooms-list"></div>
  </section>

  <!-- Tickets -->
  <section id="sec-tickets" class="hidden">
    <div class="row" style="margin-bottom:10px;">
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" data-filter="open" id="f-open">Open</button>
        <button class="btn-ghost" data-filter="resolved" id="f-resolved">Resolved</button>
      </div>
      <button class="btn-ghost" id="tk-refresh">Refresh</button>
    </div>
    <div id="tickets-list"></div>
  </section>

  <!-- Help videos -->
  <section id="sec-videos" class="hidden">
    <div class="card">
      <b id="hv-form-title">Add a help video</b>
      <div class="muted" style="margin:4px 0 10px;">Paste a YouTube link and choose who can see it. Each panel's Help section shows only the videos for its role.</div>
      <input id="hv-title" type="text" maxlength="120" placeholder="Video title, e.g. How to add a student">
      <input id="hv-url" type="text" placeholder="https://youtu.be/..." style="margin-top:8px;">
      <div class="row" style="justify-content:flex-start;gap:12px;margin-top:10px;font-weight:700;">
        <label><input type="checkbox" class="hv-aud" value="admin"> Admin</label>
        <label><input type="checkbox" class="hv-aud" value="student"> Student</label>
        <label><input type="checkbox" class="hv-aud" value="teacher"> Teacher</label>
        <label><input type="checkbox" class="hv-aud" value="parent"> Parent</label>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn-primary" id="hv-save">Add video</button>
        <button class="btn-ghost hidden" id="hv-cancel">Cancel</button>
        <span id="hv-status" class="muted"></span>
      </div>
    </div>
    <div id="hv-list"></div>
  </section>
</div>

<script>
const SERVER_URL = "https://polyabc-server.onrender.com";
const TK_LABEL = { student_absent: '🚫 Student not here', student_problem: '⚠️ Student having problems', tech_help: '🛠 Tech help' };
let techToken = null;
let tkFilter = 'open';
let tkTimer = null, roomsTimer = null;

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function getToken() { try { return localStorage.getItem('techToken'); } catch (e) { return null; } }
function setToken(t) { try { t ? localStorage.setItem('techToken', t) : localStorage.removeItem('techToken'); } catch (e) {} }
function auth() { return { Authorization: 'Bearer ' + techToken }; }

function showLogin(msg) {
  stopTimers();
  setToken(null); techToken = null;
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('login-err').textContent = msg || '';
  document.getElementById('tech-pass').value = '';
  document.getElementById('tech-pass').focus();
}
function showApp() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');
  loadRooms(); loadTickets();
  roomsTimer = setInterval(loadRooms, 30000);
  tkTimer = setInterval(loadTickets, 60000);
}
function stopTimers() { clearInterval(tkTimer); clearInterval(roomsTimer); }

async function doLogin() {
  const pw = document.getElementById('tech-pass').value;
  document.getElementById('login-err').textContent = '';
  if (!pw) { document.getElementById('login-err').textContent = 'Enter the password.'; return; }
  try {
    const r = await fetch(SERVER_URL + '/techsupport-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    const d = await r.json();
    if (d.success && d.token) { techToken = d.token; setToken(d.token); showApp(); }
    else document.getElementById('login-err').textContent = d.error || 'Wrong password.';
  } catch (e) { document.getElementById('login-err').textContent = 'Could not reach the server. Try again.'; }
}

// Any 403 means the saved login is no longer valid
async function api(path, opts) {
  const r = await fetch(SERVER_URL + path, Object.assign({ headers: auth() }, opts || {}));
  if (r.status === 403 || r.status === 401) { showLogin('Please log in again.'); throw new Error('auth'); }
  return r;
}

async function loadRooms() {
  const box = document.getElementById('rooms-list');
  try {
    const r = await api('/techsupport/rooms'); const d = await r.json();
    const rooms = d.rooms || [];
    if (!rooms.length) { box.innerHTML = '<div class="card muted" style="text-align:center;padding:22px;">No classes are open right now.</div>'; return; }
    box.innerHTML = rooms.map(x => `
      <div class="card row">
        <div><b>Class ${esc(x.room)}</b><div class="muted">Teacher: ${esc(x.teacherName || '—')}</div></div>
        <button class="btn-blue" onclick="watchRoom('${esc(x.room)}')">Watch</button>
      </div>`).join('');
  } catch (e) { if (e.message !== 'auth') box.innerHTML = '<div class="card" style="color:var(--red);">Could not load classes. Try Refresh.</div>'; }
}
function watchRoom(room) {
  window.location.href = 'classroom.html?room=' + encodeURIComponent(room) + '&it=1';
}

async function loadTickets() {
  const box = document.getElementById('tickets-list');
  try {
    const r = await api('/admin/tickets?status=' + tkFilter); const d = await r.json();
    const badge = document.getElementById('tk-badge');
    if (d.openCount) { badge.textContent = d.openCount > 9 ? '9+' : d.openCount; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
    const list = d.tickets || [];
    if (!list.length) { box.innerHTML = `<div class="card muted" style="text-align:center;padding:22px;">No ${esc(tkFilter)} tickets.</div>`; return; }
    box.innerHTML = list.map(t => {
      const when = t.createdAt ? new Date(t.createdAt).toLocaleString() : '';
      const who = t.studentFullName || t.studentName;
      return `<div class="card ${t.status === 'open' ? 'open' : 'done'}">
        <div class="row"><b>${esc(TK_LABEL[t.kind] || t.kind)}</b><span class="muted">${esc(when)}</span></div>
        <div style="margin-top:4px;">Class <b>${esc(t.room)}</b> · Teacher <b>${esc(t.teacherName)}</b>${who ? ' · Student <b>' + esc(who) + '</b>' : ''}${t.scheduledTime ? ' · ' + esc(t.scheduledTime) : ''}</div>
        ${t.status === 'resolved' ? `<div style="color:var(--green);font-size:.85rem;margin-top:4px;">✔ Resolved${t.resolutionNote ? ': ' + esc(t.resolutionNote) : ''}</div>` : ''}
        <div class="row" style="margin-top:10px;">
          ${t.status === 'open'
            ? `<input id="note-${esc(t.id)}" type="text" maxlength="500" placeholder="Note (optional)" style="flex:1;min-width:140px;"><button class="btn-green" onclick="resolveTicket('${esc(t.id)}')">Resolve</button>`
            : `<button class="btn-ghost" onclick="reopenTicket('${esc(t.id)}')">Reopen</button>`}
        </div></div>`;
    }).join('');
  } catch (e) { if (e.message !== 'auth') box.innerHTML = '<div class="card" style="color:var(--red);">Could not load tickets. Try Refresh.</div>'; }
}
async function resolveTicket(id) {
  const note = (document.getElementById('note-' + id) || {}).value || '';
  await api('/admin/tickets/' + id + '/resolve', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, auth()), body: JSON.stringify({ note }) });
  loadTickets();
}
async function reopenTicket(id) {
  await api('/admin/tickets/' + id + '/reopen', { method: 'POST', headers: auth() });
  loadTickets();
}

function showTab(name) {
  document.getElementById('sec-classes').classList.toggle('hidden', name !== 'classes');
  document.getElementById('sec-tickets').classList.toggle('hidden', name !== 'tickets');
  document.getElementById('tab-classes').classList.toggle('on', name === 'classes');
  document.getElementById('sec-videos').classList.toggle('hidden', name !== 'videos');
  document.getElementById('tab-tickets').classList.toggle('on', name === 'tickets');
  document.getElementById('tab-videos').classList.toggle('on', name === 'videos');
  if (name === 'tickets') loadTickets();
  if (name === 'videos') loadVideos();
}
function setFilter(f) {
  tkFilter = f;
  document.getElementById('f-open').style.borderColor = f === 'open' ? 'var(--purple)' : '';
  document.getElementById('f-resolved').style.borderColor = f === 'resolved' ? 'var(--purple)' : '';
  loadTickets();
}

// ── Help videos (tech support manages them) ──
let _hvEditId = null;
const HV_AUD = { admin: 'Admin', student: 'Student', teacher: 'Teacher', parent: 'Parent' };
async function loadVideos() {
  const box = document.getElementById('hv-list');
  try {
    const r = await api('/admin/help-videos'); const d = await r.json();
    const vids = d.videos || [];
    window._hvList = vids;
    if (!vids.length) { box.innerHTML = '<div class="card muted" style="text-align:center;padding:18px;">No help videos yet.</div>'; return; }
    box.innerHTML = vids.map(v => `
      <div class="card row">
        <div style="flex:1;min-width:0;">
          <b>${esc(v.title)}</b>
          <div class="muted">Visible to: ${esc((v.audience || []).map(a => HV_AUD[a] || a).join(', ') || '—')}</div>
          <a href="https://www.youtube.com/watch?v=${esc(v.youtubeId)}" target="_blank" rel="noopener" style="font-size:.85rem;color:var(--blue);">Open on YouTube</a>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-ghost" onclick="hvStartEdit('${esc(v.id)}')">Edit</button>
          <button class="btn-ghost" style="color:var(--red);" onclick="hvDelete('${esc(v.id)}')">Delete</button>
        </div>
      </div>`).join('');
  } catch (e) { if (e.message !== 'auth') box.innerHTML = '<div class="card" style="color:var(--red);">Could not load videos. Try again.</div>'; }
}
function hvReset() {
  _hvEditId = null;
  document.getElementById('hv-title').value = ''; document.getElementById('hv-url').value = '';
  document.querySelectorAll('.hv-aud').forEach(c => c.checked = false);
  document.getElementById('hv-save').textContent = 'Add video';
  document.getElementById('hv-form-title').textContent = 'Add a help video';
  document.getElementById('hv-cancel').classList.add('hidden');
}
function hvStartEdit(id) {
  const v = (window._hvList || []).find(x => x.id === id); if (!v) return;
  _hvEditId = id;
  document.getElementById('hv-title').value = v.title;
  document.getElementById('hv-url').value = 'https://youtu.be/' + v.youtubeId;
  document.querySelectorAll('.hv-aud').forEach(c => c.checked = (v.audience || []).includes(c.value));
  document.getElementById('hv-save').textContent = 'Save changes';
  document.getElementById('hv-form-title').textContent = 'Edit help video';
  document.getElementById('hv-cancel').classList.remove('hidden');
  document.getElementById('hv-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function hvSave() {
  const st = document.getElementById('hv-status');
  const audience = [...document.querySelectorAll('.hv-aud:checked')].map(c => c.value);
  const body = { title: document.getElementById('hv-title').value.trim(), url: document.getElementById('hv-url').value.trim(), audience };
  st.textContent = 'Saving…';
  try {
    const r = _hvEditId
      ? await api('/admin/help-videos/' + _hvEditId, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, auth()), body: JSON.stringify(body) })
      : await api('/admin/help-videos', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, auth()), body: JSON.stringify(body) });
    const d = await r.json();
    if (d.success) { st.textContent = _hvEditId ? 'Saved.' : 'Added.'; hvReset(); loadVideos(); }
    else st.textContent = d.message || 'Could not save. Check the link and choose at least one audience.';
  } catch (e) { if (e.message !== 'auth') st.textContent = 'Could not save. Try again.'; }
}
async function hvDelete(id) {
  if (!confirm('Delete this video?')) return;
  await api('/admin/help-videos/' + id, { method: 'DELETE', headers: auth() });
  if (_hvEditId === id) hvReset();
  loadVideos();
}

document.getElementById('hv-save').onclick = hvSave;
document.getElementById('hv-cancel').onclick = () => { hvReset(); document.getElementById('hv-status').textContent = ''; };
document.getElementById('tab-videos').onclick = () => showTab('videos');
document.getElementById('login-btn').onclick = doLogin;
document.getElementById('tech-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logout-btn').onclick = () => showLogin('');
document.getElementById('rooms-refresh').onclick = loadRooms;
document.getElementById('tk-refresh').onclick = loadTickets;
document.getElementById('tab-classes').onclick = () => showTab('classes');
document.getElementById('tab-tickets').onclick = () => showTab('tickets');
document.getElementById('f-open').onclick = () => setFilter('open');
document.getElementById('f-resolved').onclick = () => setFilter('resolved');

// Start: use saved login if there is one
techToken = getToken();
document.getElementById('f-open').style.borderColor = 'var(--purple)';
if (techToken) showApp(); else showLogin('');
</script>
</body>
</html>
